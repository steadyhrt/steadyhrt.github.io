<!doctype html><html lang="en"><head><meta charset="utf-8"><script>if(location.protocol==='http:'&&location.hostname==='steadyhrt.com')location.replace('https:'+location.href.slice(5))</script><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting… | SteadyHRT</title></head>
<body style="font:18px -apple-system,Helvetica,sans-serif;padding:40px;color:#3B1F33;background:#F6EEF2">
<p id="m">Connecting SteadyHRT…</p>
<script>
  var q = location.search || '';
  var pm = /[?&]state=p(\d{4,5})\./.exec(q), port = pm ? pm[1] : '8765';   // callers may name their own local port in state: p<port>.<random>
  if (/[?&](code|error)=/.test(q)) location.replace('http://localhost:' + port + '/callback' + q);
  else document.getElementById('m').textContent = 'Nothing to do here.';
</script></body></html>
